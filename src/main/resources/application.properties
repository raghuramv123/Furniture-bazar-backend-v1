spring.application.name=-1



server.port=9092
#server.servlet.context-path=/erp-backend-adhikrit
spring.datasource.url= jdbc:postgresql://localhost:5432/furniture-appdb
spring.main.allow-circular-references=true
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation= true
spring.jpa.properties.hibernate.event.merge.entity_copy_observer=allow
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.listeners.envers.autoRegister=true
## Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto= create
#
#
#app.jwt.secret=YourBase64EncodedSecretKeyHereMustBe256BitsOrLonger==
#app.jwt.expiration-ms=900000
#app.refresh-token.expiry-days=7

#spring.jpa.show-sql=true
logging.level.org.hibernate=DEBUG

app.upload.dir=uploads/products
app.base-url=http://localhost:9092


## H2 Console — http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.defer-datasource-initialization=true



